# Пример конфигурации dns-guard.
# Скопируйте в config.yaml и поправьте под себя.

listen:
  udp: ":53"
  tcp: ":53"

web:
  enabled: true
  listen: ":80"

cache:
  enabled: true
  max_entries: 10000
  min_ttl: 600     # MIN-TTL: пол TTL ответа (секунды)
  max_ttl: 0       # MAX-TTL: 0 = без верхней границы
  neg_ttl: 0       # потолок TTL негативных ответов (NXDOMAIN/NODATA), 0 = без потолка

stats:
  # Лимит уникальных доменов в таблице статистики. Новые домены сверх лимита
  # не попадают в таблицу (общие счётчики продолжают расти). Применяется на лету.
  max_domains: 50000

upstream:
  # timeout — таймаут ОДНОЙ попытки к апстриму. Общий бюджет запроса =
  # timeout × число попыток группы (primary+fallback), чтобы fallback успевал
  # сработать даже если primary «висит» (таймаутит, а не падает быстро).
  timeout: 3s

# EDNS Client Subnet (RFC 7871): в запросы к апстриму добавляется наша
# публичная подсеть. Гео-зависимые CDN (и сайты за VPN) тогда возвращают
# адреса, близкие к нам, а не к локации удалённого резолвера.
# Подсеть задаётся вручную: замените 203.0.113.0/24 на свой публичный IPv4-
# префикс. Слишком конкретный префикс обрезается до /24 (IPv6 — до /56).
# В группе можно отключить отдельно (`ecs: false`), если зона специально
# должна резолвиться с локацией апстрима.
ecs:
  enabled: true
  subnet: "203.0.113.0/24"        # пример: замените на свой публичный IPv4-префикс
  # ipv6_subnet: "2001:db8::/56"  # опционально (обрезается до /56)

# Блокировка доменов: заблокированный домен и все его поддомены получают
# ответ, по которому невозможно установить соединение, и не уходят к апстриму.
# mode: nodata — пустой NOERROR (по умолчанию); zero — A=0.0.0.0, AAAA=::.
# Список можно менять на вкладке Stats веб-интерфейса (иконка у домена).
# block:
#   mode: nodata
#   domains:
#     - ads.example.com
#     - tracker.example.net

# Группы вышестоящих серверов. Протокол задаётся на группу: udp | dot | doh.
# primary используется первым (с ротацией), fallback — при ошибке запроса или
# NODATA-ответе основного на A/AAAA (резерв проверяет сомнительный ответ).
# NODATA на другие типы (HTTPS/SVCB и т.п.) — штатный ответ, резерв не нужен.
# Любой адрес может нести префикс "<udp|dot|doh>+", который перекрывает протокол
# группы — так в одной группе смешиваются протоколы (UDP primary + DoH fallback).
groups:
  isp:                        # зона .ru: локальный UDP-primary + DoH-fallback
    protocol: udp
    primary:  ["192.168.1.1:53"]
    fallback: ["doh+https://9.9.9.9/dns-query", "doh+https://94.140.14.14/dns-query"]
  vps:                        # дефолтная группа: удалённый DoH-сервер
    protocol: doh
    primary:  ["https://doh.example.com:8443/secret/dns-query"]
    fallback: ["https://9.9.9.9/dns-query", "https://94.140.14.14/dns-query", "https://1.1.1.1/dns-query"]
    # bootstrap — plain-DNS для резолва хостнейма DoH/DoT, когда hosts не задан.
    # bootstrap: ["77.88.8.8"]
    # hosts — статический маппинг хостнейм→IP: используется, когда bootstrap-UDP
    # до резолвера недоступен. Хостнейм остаётся в URL (TLS-SNI и проверка
    # сертификата), а TCP-соединение идёт на указанный IP.
    hosts: {"doh.example.com": "203.0.113.10"}
    # ecs: false                # не передавать нашу подсеть — ответы «оттуда»

default_group: vps

# Маршрутизация по зонам (longest-suffix match).
rules:
  - zone: "ru"
    group: isp
  # Зоны, которые должны резолвиться с локацией удалённого апстрима:
  # - zone: "example.org"
  #   group: vps
